name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Svelte check
        run: npm run check

      - name: Build
        run: npm run build
        env:
          SEPAY_WEBHOOK_API_KEY: ci-placeholder
          SEPAY_ACCOUNT_NUMBER: '0010000000000'
          SEPAY_BANK_CODE: Vietcombank
          SEPAY_ORDER_PREFIX: SEVQR
          DEV_SIMULATE_TOKEN: ci-placeholder
